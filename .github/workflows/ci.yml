name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ChipShift64.sln -c Release
      - name: Test with coverage
        run: ./test.ps1 -TestArguments @('-c', 'Release', '--no-build', '--collect:XPlat Code Coverage', '--results-directory', "$env:GITHUB_WORKSPACE/bin/test-results", '--logger', 'trx')
      - name: Save test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: bin/test-results/
          if-no-files-found: warn
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: bin/test-results
          fail_ci_if_error: false
      - name: Publish translator
        run: dotnet publish src/ChipShift64/ChipShift64.csproj -c Release -r win-x64 --self-contained false -o bin/delivery/ChipShift64
      - name: Package translator
        run: |
          Copy-Item README.md, LICENSE bin/delivery/ChipShift64/
          Compress-Archive -Path bin/delivery/ChipShift64/* -DestinationPath bin/delivery/ChipShift64-win-x64.zip
          $hash = (Get-FileHash bin/delivery/ChipShift64-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ChipShift64-win-x64.zip" | Set-Content bin/delivery/SHA256SUMS -Encoding ascii
      - name: Save release package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            bin/delivery/ChipShift64-win-x64.zip
            bin/delivery/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
